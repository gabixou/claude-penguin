<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Claude Penguin — Painel Admin</title>
<style>
  :root { --bg:#0f1720; --panel:#1a2532; --line:#2c3d50; --txt:#dfe9f3; --mut:#8fa3b8; --acc:#5aa9ff; --ok:#4ec98a; --err:#ff6b6b; --warn:#ffc857; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.45 "Segoe UI",Arial,sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; color:var(--acc); }
  header .who { color:var(--mut); font-size:12px; margin-left:auto; }
  main { display:grid; grid-template-columns:340px 1fr; gap:14px; padding:14px 18px; max-width:1400px; margin:0 auto; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:0 0 10px; }
  input,select,textarea { width:100%; padding:7px 9px; background:#0d141c; color:var(--txt); border:1px solid var(--line); border-radius:6px; font:inherit; margin-bottom:8px; }
  button { padding:7px 12px; background:var(--acc); color:#0b1220; border:0; border-radius:6px; font-weight:700; cursor:pointer; }
  button.sec { background:#2c3d50; color:var(--txt); }
  button.danger { background:#a02c2c; color:#fff; }
  button.ok { background:#2c6e49; color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:5px 7px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:600; }
  tr.clickable { cursor:pointer; } tr.clickable:hover { background:#22303f; }
  .badge { display:inline-block; padding:1px 7px; border-radius:9px; font-size:11px; font-weight:700; }
  .b-player{background:#2c3d50;color:#cfe0f0} .b-moderator{background:#3d2f5e;color:#d9c8ff} .b-admin{background:#5e2f2f;color:#ffd0d0}
  .b-open{background:#5e4a1f;color:#ffe9b0} .b-resolved{background:#1f4a33;color:#b8f0d0} .b-dismissed{background:#333;color:#aaa}
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .kv { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed var(--line); font-size:13px; }
  .kv b { color:var(--acc); }
  .actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .msg { font-size:12px; min-height:16px; margin-top:8px; }
  .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }
  .hidden { display:none; }
  #loginBox { max-width:380px; margin:12vh auto; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .tabs button { background:#22303f; color:var(--txt); }
  .tabs button.on { background:var(--acc); color:#0b1220; }
  .scroll { max-height:420px; overflow:auto; }
  code { color:var(--warn); }
</style>
</head>
<body>
<header>
  <h1>🐧 Claude Penguin — Admin</h1>
  <span class="who" id="who"></span>
  <button class="sec hidden" id="btnLogout">Sair</button>
</header>

<main id="app" class="hidden">
  <div>
    <section>
      <h2>Buscar jogador</h2>
      <input id="q" placeholder="username ou player_id…">
      <div class="scroll"><table id="results"><tbody></tbody></table></div>
    </section>
    <section style="margin-top:14px">
      <h2>Fila de denúncias <span id="repCount"></span></h2>
      <div class="scroll"><table id="reports"><thead><tr><th>#</th><th>De</th><th>Contra</th><th>Motivo</th><th></th></tr></thead><tbody></tbody></table></div>
    </section>
    <section style="margin-top:14px">
      <h2>Resumo</h2>
      <div id="stats"></div>
    </section>
  </div>

  <div>
    <section id="detail" class="hidden">
      <h2>Jogador</h2>
      <div class="grid2">
        <div><div id="dInfo"></div></div>
        <div>
          <h2 style="margin-top:0">Ações</h2>
          <div class="actions">
            <button class="sec" onclick="act('coins')">Editar moedas</button>
            <button class="sec" onclick="act('name')">Renomear</button>
            <button class="sec" onclick="act('items')">Dar item</button>
            <button class="sec" onclick="toggleAllItems()">All-items</button>
            <button class="danger" onclick="act('ban')">Banir</button>
            <button class="ok" onclick="api('unban',{})">Desbanir</button>
            <button class="sec" onclick="act('mute')">Silenciar</button>
            <button class="sec" onclick="api('unmute',{})">Remover mute</button>
            <button class="danger" onclick="api('kick',{reason:'kick via painel'})">Expulsar</button>
            <button class="sec" onclick="act('password')">Redefinir senha</button>
            <button class="sec" onclick="api('recovery',{})">Novo recovery</button>
            <button class="sec" id="btnRole" onclick="act('role')">Papel</button>
          </div>
          <div class="msg" id="dMsg"></div>
        </div>
      </div>
      <div class="grid2" style="margin-top:12px">
        <div><h2>Inventário (<span id="invCount">0</span>)</h2><div class="scroll"><table id="inv"><tbody></tbody></table></div></div>
        <div>
          <h2>Warnings</h2><div class="scroll"><table id="warns"><tbody></tbody></table></div>
          <h2 style="margin-top:10px">Logins recentes</h2><div class="scroll"><table id="logins"><tbody></tbody></table></div>
        </div>
      </div>
    </section>

    <section style="margin-top:14px">
      <div class="tabs">
        <button data-tab="filters" class="on" onclick="tab('filters')">Filtro de chat</button>
        <button data-tab="parties" onclick="tab('parties')">Festas</button>
        <button data-tab="bans" onclick="tab('bans')">Banimentos</button>
        <button data-tab="audit" onclick="tab('audit')">Auditoria</button>
      </div>
      <div id="tabBody"></div>
    </section>
  </div>
</main>

<section id="loginBox">
  <h2>Login de moderador/admin</h2>
  <input id="lu" placeholder="usuário" autocomplete="username">
  <input id="lp" type="password" placeholder="senha" autocomplete="current-password">
  <button onclick="doLogin()">Entrar</button>
  <div class="msg" id="lMsg"></div>
</section>

<script>
const $ = (id) => document.getElementById(id);
let TOKEN = localStorage.getItem('cp_admin_token') || '';
let ME = null;
let CURRENT = null; // player selecionado

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    method: opts.method || (opts.body ? 'POST' : 'GET'),
    headers: { 'Content-Type': 'application/json', ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { logout(); throw new Error('Sessão expirada'); }
  if (!res.ok) throw new Error(data.message || data.error || ('HTTP ' + res.status));
  return data;
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (ts) => ts ? new Date(ts).toLocaleString('pt-BR') : '—';
const dur = (ms) => ms ? Math.round((ms - Date.now()) / 60000) + ' min' : '—';

async function doLogin() {
  $('lMsg').className = 'msg'; $('lMsg').textContent = '';
  try {
    const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: $('lu').value, password: $('lp').value }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || 'Falha no login');
    TOKEN = d.token; localStorage.setItem('cp_admin_token', TOKEN);
    ME = d.player; boot();
  } catch (e) { $('lMsg').className = 'msg err'; $('lMsg').textContent = e.message; }
}
function logout() { TOKEN=''; ME=null; localStorage.removeItem('cp_admin_token'); location.reload(); }

async function boot() {
  $('loginBox').classList.add('hidden'); $('app').classList.remove('hidden');
  $('btnLogout').classList.remove('hidden');
  $('who').textContent = `${ME.username} — ${ME.role}`;
  loadStats(); loadReports(); loadFilters(); loadBans(); loadAudit(); search('');
}

async function loadStats() {
  const s = await api('/stats');
  $('stats').innerHTML = Object.entries(s).map(([k,v]) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`).join('');
}
async function search(q) {
  const r = await api('/players?q=' + encodeURIComponent(q || ''));
  $('results').innerHTML = '<tbody>' + r.players.map(p =>
    `<tr class="clickable" onclick='pick(${JSON.stringify(p.player_id)})'><td>${esc(p.username)}</td><td><span class="badge b-${p.role}">${p.role}</span></td><td>${p.coins}</td></tr>`).join('') + '</tbody>';
}
async function pick(id) {
  CURRENT = id;
  const d = await api('/players/' + encodeURIComponent(id));
  const p = d.player;
  $('detail').classList.remove('hidden');
  $('dInfo').innerHTML = `
    <div class="kv"><span>Username</span><b>${esc(p.username)}</b></div>
    <div class="kv"><span>player_id</span><b>${esc(p.player_id)}</b></div>
    <div class="kv"><span>Papel</span><b><span class="badge b-${p.role}">${p.role}</span></b></div>
    <div class="kv"><span>Moedas</span><b>${p.coins}</b></div>
    <div class="kv"><span>Itens</span><b>${d.inventoryCount}</b></div>
    <div class="kv"><span>Senha</span><b>${p.has_password ? 'sim' : 'não'}</b></div>
    <div class="kv"><span>All-items</span><b>${p.all_items ? 'sim' : 'não'}</b></div>
    <div class="kv"><span>Mute até</span><b>${d.mutedUntil ? fmt(d.mutedUntil) : '—'}</b></div>
    <div class="kv"><span>Ban ativo</span><b>${d.activeBan ? esc(d.activeBan.reason || 'sim') + ' ' + (d.activeBan.expires_at ? 'até ' + fmt(d.activeBan.expires_at) : 'perm.') : 'não'}</b></div>
    <div class="kv"><span>Criado</span><b>${fmt(p.created_at)}</b></div>
    <div class="kv"><span>Visto por último</span><b>${fmt(p.last_seen)}</b></div>`;
  $('btnRole').style.display = ME.role === 'admin' ? '' : 'none';
  $('invCount').textContent = d.inventoryCount;
  $('dMsg').className = 'msg'; $('dMsg').textContent = '';
  const inv = await api('/players/' + encodeURIComponent(id) + '/inventory');
  $('inv').innerHTML = '<tbody>' + inv.inventory.slice(0, 300).map(i => `<tr><td>${i.itemId}</td><td>${i.quantity}</td></tr>`).join('') + '</tbody>';
  const w = await api('/players/' + encodeURIComponent(id) + '/warnings');
  $('warns').innerHTML = '<tbody>' + w.warnings.map(x => `<tr><td>${esc(x.reason || '')}</td><td>${esc(x.moderator_name || '')}</td><td>${fmt(x.created_at)}</td></tr>`).join('') || '<tr><td colspan=3>—</td></tr>') + '</tbody>';
  const l = await api('/players/' + encodeURIComponent(id) + '/logins');
  $('logins').innerHTML = '<tbody>' + l.logins.map(x => `<tr><td>${fmt(x.created_at)}</td><td>${x.success ? 'ok' : 'falha'}</td><td>${esc(x.ip || '')}</td></tr>`).join('') + '</tbody>';
}

async function act(kind) {
  if (!CURRENT) return;
  const base = '/players/' + encodeURIComponent(CURRENT);
  try {
    if (kind === 'coins') {
      const v = prompt('Moedas — valor absoluto ou delta com +/-:', '0');
      if (v === null) return;
      const n = Number(v);
      const body = v.trim().startsWith('+') || v.trim().startsWith('-') ? { amount: n } : { coins: n };
      await api(base + '/coins', { body });
    } else if (kind === 'name') {
      const v = prompt('Novo username:'); if (!v) return;
      await api(base + '/name', { body: { username: v } });
    } else if (kind === 'items') {
      const id = prompt('itemId:'); if (!id) return;
      const qty = prompt('quantidade:', '1') || '1';
      await api(base + '/items', { body: { action:'grant', itemId: Number(id), quantity: Number(qty) } });
    } else if (kind === 'ban') {
      const reason = prompt('Motivo do ban (opcional):', '') ?? '';
      const mins = prompt('Duração em minutos (vazio = permanente):', '');
      await api(base + '/ban', { body: { reason, minutes: mins ? Number(mins) : null } });
    } else if (kind === 'mute') {
      const mins = prompt('Silenciar por quantos minutos?', '10'); if (!mins) return;
      await api(base + '/mute', { body: { minutes: Number(mins) } });
    } else if (kind === 'password') {
      const v = prompt('Nova senha (6-72 chars):'); if (!v) return;
      await api(base + '/password', { body: { password: v } });
    } else if (kind === 'role') {
      const v = prompt('Novo papel (player/moderator/admin):'); if (!v) return;
      await api(base + '/role', { body: { role: v } });
    }
    $('dMsg').className = 'msg ok'; $('dMsg').textContent = 'OK';
    pick(CURRENT); loadStats();
  } catch (e) { $('dMsg').className = 'msg err'; $('dMsg').textContent = e.message; }
}
async function api_(p, b) { return api(p, { body: b }); }
async function toggleAllItems() {
  if (!CURRENT) return;
  const d = await api('/players/' + encodeURIComponent(CURRENT));
  await api_('/players/' + encodeURIComponent(CURRENT) + '/all-items', { enabled: !d.player.all_items });
  pick(CURRENT);
}

async function loadReports() {
  const r = await api('/reports?status=open');
  $('repCount').textContent = `(${r.reports.length})`;
  $('reports').querySelector('tbody').innerHTML = r.reports.map(x =>
    `<tr><td>${x.id}</td><td>${esc(x.reporter_name || x.reporter_id)}</td><td>${esc(x.target_name || x.target_player_id || 'msg')}</td><td>${esc(x.reason || '')}</td>
     <td><button class="ok" onclick="resolveRep(${x.id},'resolved')">resolver</button>
         <button class="sec" onclick="resolveRep(${x.id},'dismissed')">dispensar</button></td></tr>`).join('');
}
async function resolveRep(id, status) { await api('/reports/' + id, { body: { status } }); loadReports(); loadStats(); }

let TAB = 'filters';
async function tab(t) {
  TAB = t;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  if (t === 'filters') return loadFilters();
  if (t === 'parties') return loadParties();
  if (t === 'bans') return loadBans();
  if (t === 'audit') return loadAudit();
}

// ---------- Festas ----------
async function loadParties() {
  const r = await api('/parties');
  const act = r.active;
  const toLocal = (ms) => ms ? new Date(ms - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : '';
  $('tabBody').innerHTML = `
    ${act ? `<div class="kv"><span>Festa ativa</span><b>${esc(act.name)} (até ${fmt(act.endAt)})</b></div>` : '<div class="kv"><span>Festa ativa</span><b>nenhuma</b></div>'}
    <div class="actions" style="margin:10px 0">
      <input id="pt-name" placeholder="nome da festa" style="flex:2;margin:0">
      <input id="pt-start" type="datetime-local" style="flex:1;margin:0">
      <input id="pt-end" type="datetime-local" style="flex:1;margin:0">
      <input id="pt-tz" placeholder="fuso (ex.: America/Sao_Paulo)" style="flex:1;margin:0">
      <button onclick="createParty()">Agendar</button>
    </div>
    <div class="scroll"><table><thead><tr><th>#</th><th>Nome</th><th>Início</th><th>Fim</th><th>Fuso</th><th>Status</th><th></th></tr></thead><tbody>` +
    r.parties.map(p => {
      const now = Date.now();
      const st = p.status === 'cancelled' ? 'cancelada' : (p.start_at <= now && p.end_at > now ? 'ATIVA' : (p.start_at > now ? 'agendada' : 'encerrada'));
      return `<tr><td>${p.id}</td><td>${esc(p.name)}</td><td>${fmt(p.start_at)}</td><td>${fmt(p.end_at)}</td>
        <td>${esc(p.timezone || '')}</td><td><span class="badge ${st === 'ATIVA' ? 'b-open' : 'b-player'}">${st}</span></td>
        <td style="white-space:nowrap">
          <button class="ok" onclick="activateParty(${p.id})">ativar</button>
          <button class="sec" onclick="partySubs(${p.id})">trocas</button>
          <button class="danger" onclick="deleteParty(${p.id})">✕</button></td></tr>` +
        `<tr id="subs-${p.id}" style="display:none"><td colspan=7><div id="subs-body-${p.id}"></div></td></tr>`;
    }).join('') + '</tbody></table></div>';
}
async function createParty() {
  const start = new Date($('pt-start').value).getTime();
  const end = new Date($('pt-end').value).getTime();
  try {
    await api('/parties', { body: { name: $('pt-name').value, startAt: start, endAt: end, timezone: $('pt-tz').value || null } });
    loadParties(); loadStats();
  } catch (e) { alert(e.message); }
}
async function activateParty(id) {
  const mins = prompt('Duração em minutos:', '1440'); if (!mins) return;
  await api(`/parties/${id}/activate`, { body: { durationMin: Number(mins) } });
  loadParties();
}
async function deleteParty(id) {
  if (!confirm('Remover esta festa e suas trocas?')) return;
  await api(`/parties/${id}`, { method: 'DELETE' });
  loadParties();
}
async function partySubs(id) {
  const row = document.getElementById('subs-' + id);
  const body = document.getElementById('subs-body-' + id);
  if (row.style.display !== 'none') { row.style.display = 'none'; return; }
  row.style.display = '';
  const d = await api('/parties/' + id);
  const kinds = ['package','music','catalogue','free_items','extra_rooms','map'];
  body.innerHTML = `<div class="actions">
      <input id="sb-room" placeholder="roomId (vazio = global)" style="width:130px;margin:0">
      <select id="sb-kind" style="width:130px;margin:0">${kinds.map(k=>`<option>${k}</option>`).join('')}</select>
      <input id="sb-val" placeholder="valor" style="flex:1;margin:0">
      <button onclick="addSub(${id})">Adicionar</button></div>
    <table><tbody>` +
    (d.substitutions || []).map(s => `<tr><td>${esc(s.room_id || '*')}</td><td>${esc(s.kind)}</td><td><code>${esc(s.value)}</code></td>
      <td><button class="danger" onclick="delSub(${id},'${esc(s.room_id||'')}','${s.kind}')">✕</button></td></tr>`).join('') +
    `</tbody></table>`;
}
async function addSub(id) {
  await api(`/parties/${id}/substitutions`, { body: {
    roomId: $('sb-room').value || null, kind: $('sb-kind').value, value: $('sb-val').value } });
  partySubs(id); partySubs(id); // re-render aberto
}
async function delSub(id, roomId, kind) {
  await api(`/parties/${id}/substitutions?roomId=${encodeURIComponent(roomId)}&kind=${kind}`, { method: 'DELETE' });
  partySubs(id); partySubs(id);
}
async function loadFilters() {
  const r = await api('/filters');
  $('tabBody').innerHTML = `<div class="actions" style="margin-bottom:10px">
      <input id="fp" placeholder="regex do padrão" style="flex:1;margin:0">
      <select id="fa" style="width:110px;margin:0"><option value="mask">mascarar</option><option value="block">bloquear</option></select>
      <button onclick="addFilter()">Adicionar</button></div>
    <div class="scroll"><table><thead><tr><th>#</th><th>Padrão</th><th>Ação</th><th>Por</th><th></th></tr></thead><tbody>` +
    r.rules.map(x => `<tr><td>${x.id}</td><td><code>${esc(x.pattern)}</code></td><td>${x.action}</td><td>${esc(x.created_by_name || '')}</td>
      <td><button class="danger" onclick="delFilter(${x.id})">✕</button></td></tr>`).join('') + '</tbody></table></div>';
}
async function addFilter() {
  try { await api('/filters', { body: { pattern: $('fp').value, action: $('fa').value } }); loadFilters(); }
  catch(e){ alert(e.message); }
}
async function delFilter(id) { await api('/filters/' + id, { method:'DELETE' }); loadFilters(); }

async function loadBans() {
  const r = await api('/bans?status=all');
  $('tabBody').innerHTML = `<div class="scroll"><table><thead><tr><th>#</th><th>Jogador</th><th>Motivo</th><th>Por</th><th>Criado</th><th>Expira</th><th>Status</th><th></th></tr></thead><tbody>` +
    r.bans.map(b => {
      const active = !b.revoked_at && (!b.expires_at || b.expires_at > Date.now());
      return `<tr><td>${b.id}</td><td>${esc(b.username || b.player_id)}</td><td>${esc(b.reason || '')}</td>
        <td>${b.moderator_id || '—'}</td><td>${fmt(b.created_at)}</td><td>${b.expires_at ? fmt(b.expires_at) : 'perm.'}</td>
        <td><span class="badge ${active ? 'b-open' : 'b-dismissed'}">${active ? 'ativo' : (b.revoked_at ? 'revogado' : 'expirado')}</span></td>
        <td>${active ? `<button class="ok" onclick="unbanPlayer('${esc(b.player_id)}')">desbanir</button>` : ''}</td></tr>`;
    }).join('') + '</tbody></table></div>';
}
async function unbanPlayer(id) { await api('/players/' + encodeURIComponent(id) + '/unban', { body:{} }); loadBans(); }

async function loadAudit() {
  const r = await api('/audit?limit=200');
  $('tabBody').innerHTML = `<div class="scroll"><table><thead><tr><th>#</th><th>Ator</th><th>Ação</th><th>Alvo</th><th>Detalhes</th><th>Quando</th></tr></thead><tbody>` +
    r.audit.map(a => `<tr><td>${a.id}</td><td>${esc(a.actor_name || a.actor_id || '—')}</td><td>${esc(a.action)}</td><td>${esc(a.target_id ?? '')}</td>
      <td><code>${esc(a.details || '')}</code></td><td>${fmt(a.created_at)}</td></tr>`).join('') + '</tbody></table></div>';
}

$('q').addEventListener('input', (e) => search(e.target.value));
$('btnLogout').onclick = logout;
if (TOKEN) { api('/me').then(m => { ME = m; boot(); }).catch(() => logout()); }
</script>
</body>
</html>
