name: Smoke test

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: smoke-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Queued runs can be superseded by newer pushes, so record the range for the report.
      - name: Find last tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BEFORE: ${{ github.event.before }}
        shell: powershell
        run: |
          $runs = gh run list --repo $env:GITHUB_REPOSITORY --workflow devin-local-smoke.yml --branch master --status completed --limit 200 --json headSha,conclusion | ConvertFrom-Json
          $last = $runs | Where-Object { $_.conclusion -eq 'success' -or $_.conclusion -eq 'failure' } | Select-Object -First 1 -ExpandProperty headSha
          $before = if ($last) { $last } else { $env:EVENT_BEFORE }
          Add-Content -Path $env:GITHUB_ENV -Value "PUSH_BEFORE=$before"
          Write-Host "PUSH_BEFORE=$before PUSH_AFTER=$env:GITHUB_SHA"

      - name: Server deps + unit tests
        shell: powershell
        run: |
          cd server
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test-tables.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Um unico step para todo o resto: processos filhos de um step sao
      # encerrados quando ele termina, entao servidor/build/browser precisam
      # viver dentro do mesmo step.
      - name: Smoke completo (server e2e + build + browser)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $failed = $false
          function Step($name, [scriptblock]$fn) {
            Write-Host "`n=== $name ==="
            & $fn
            if ($LASTEXITCODE -ne 0) { $script:failed = $true; Write-Host "FALHOU: $name" }
          }

          # porta aleatoria: servidor de teste antigo nao pode sequestrar os testes
          $port = $null
          foreach ($i in 1..30) {
            $cand = 18000 + (Get-Random -Max 2000)
            if (-not (Get-NetTCPConnection -LocalPort $cand -State Listen -ErrorAction SilentlyContinue)) { $port = $cand; break }
          }
          if (-not $port) { Write-Host "nenhuma porta livre"; exit 1 }
          $env:SMOKE_PORT = "$port"
          $env:SMOKE_WS_URL = "ws://localhost:$port"
          Write-Host "porta de teste: $port"

          cd server
          $env:PENGUIN_DB = Join-Path $env:TEMP "penguin-smoke-$([guid]::NewGuid().ToString('N')).db"
          $env:PORT = "$port"
          $srv = Start-Process -FilePath "node" -ArgumentList "src/index.js" -WorkingDirectory "server" -PassThru -WindowStyle Hidden -RedirectStandardOutput "server-smoke.out.log" -RedirectStandardError "server-smoke.err.log"
          try {
            $ok = $false
            foreach ($i in 1..40) {
              try {
                $t = New-Object Net.Sockets.TcpClient
                $t.Connect('127.0.0.1', $port); $t.Close(); $ok = $true; break
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ok -or $srv.HasExited) {
              Get-Content server-smoke.err.log -ErrorAction SilentlyContinue
              exit 1
            }
            Write-Host "server pid=$($srv.Id)"

            Step "test-e2e" { node test-e2e.mjs }
            Step "test-multi" { node test-multi.mjs }

            cd ..\client
            Step "npm ci (client)" { npm ci }
            $env:VITE_WS_URL = "ws://localhost:$port"
            Step "build client" { npm run build }

            cd ..\tools
            Step "npm ci (tools)" { npm ci }
            Step "browser smoke" { node smoke-ci.mjs http://localhost:3100 }
          } finally {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          }
          if ($failed) { exit 1 }
