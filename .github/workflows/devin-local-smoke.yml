name: Devin Local smoke test

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: devin-local-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Run Devin Local smoke test
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: devin -p --prompt-file .github/devin/smoke-test.md --permission-mode dangerous --respect-workspace-trust false
