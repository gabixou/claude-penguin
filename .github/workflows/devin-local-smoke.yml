name: Devin Local smoke test

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: devin-local-smoke
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Queued runs can be superseded by newer pushes, so test from the last commit a run actually tested.
      - name: Find last tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BEFORE: ${{ github.event.before }}
        shell: powershell
        run: |
          $runs = gh run list --repo $env:GITHUB_REPOSITORY --workflow devin-local-smoke.yml --branch master --status completed --limit 200 --json headSha,conclusion | ConvertFrom-Json
          $last = $runs | Where-Object { $_.conclusion -eq 'success' -or $_.conclusion -eq 'failure' } | Select-Object -First 1 -ExpandProperty headSha
          $before = if ($last) { $last } else { $env:EVENT_BEFORE }
          Add-Content -Path $env:GITHUB_ENV -Value "PUSH_BEFORE=$before"

      - name: Run Devin Local smoke test
        env:
          PUSH_AFTER: ${{ github.sha }}
        run: devin -p --prompt-file .github/devin/smoke-test.md --permission-mode dangerous --respect-workspace-trust false
