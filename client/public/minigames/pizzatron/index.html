<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Pizzatron 3000</title>
		<link rel="stylesheet" href="Include/Style.css">
		<script src="lib/jquery.min.js"></script>
		<script src="Include/Scripts/sbd-shim.js"></script>
		<style>
		/* o iframe do jogo preenche o viewport inteiro — o Game.html escala
		   o .game (1000x610 nativo) para caber nos 1520x960 do overlay */
		html, body { height: 100%; margin: 0; }
		.game-box { top: 0; left: 0; width: 100%; height: 100%; }
		</style>
	</head>
	<body oncontextmenu="return false">
		<iframe class="game-box" src="Game.html"></iframe>
		<script src="Include/Scripts/MainWindow.js"></script>
		<script>
		// repassa mensagens do Game.html (iframe aninhado) para a janela pai
		// (overlay do cliente) — sem isso o e.source nao bateria no overlay.
		window.addEventListener("message", function(e) {
			var d = e.data;
			if (d && d.source === "pizzatron" && window.parent !== window) {
				window.parent.postMessage(d, "*")
			}
		})
		</script>
	</body>
</html>
